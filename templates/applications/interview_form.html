{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0">Schedule Interview for {{ app.company }}</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                        </div>
                    {% endfor %}
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'application_detail' app.id %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-warning px-4">Save Interview</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
