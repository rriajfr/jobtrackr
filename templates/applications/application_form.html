{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <!-- This automatically shows "Edit" or "Add" based on what you are doing -->
                <h4 class="mb-0">
                    {% if object %}Edit Application{% else %}Add New Application{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- Render the form fields with Bootstrap styling -->
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    
                    <div class="d-flex justify-content-between mt-4">
                        <a href="{% url 'application_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Application</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
